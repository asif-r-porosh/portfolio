<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<link rel="canonical" href="{{url}}">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:url" content="{{url}}">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23f0ebe1'/%3E%3Ctext x='16' y='23' font-family='monospace' font-size='22' text-anchor='middle' fill='%232a2723'%3Eu%3C/text%3E%3C/svg%3E">
<link rel="preload" href="/fonts/plex-sans-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/plex-mono-400.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:"IBM Plex Sans";font-weight:400;font-style:normal;font-display:swap;src:url(/fonts/plex-sans-400.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Sans";font-weight:300;font-style:normal;font-display:swap;src:url(/fonts/plex-sans-300.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Sans";font-weight:300;font-style:italic;font-display:swap;src:url(/fonts/plex-sans-300i.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Sans";font-weight:600;font-style:normal;font-display:swap;src:url(/fonts/plex-sans-600.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Mono";font-weight:400;font-style:normal;font-display:swap;src:url(/fonts/plex-mono-400.woff2) format("woff2")}


:root{
  --paper:#f0ebe1; --ink:#2a2723; --muted:#6a645a; --accent:#35525f; --rule:#d9d3c6;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root{ --paper:#1f1e1b; --ink:#d8d3c7; --muted:#9a9488; --accent:#8fb0bb; --rule:#34322d; }
}
*{box-sizing:border-box}
html{font-size:16px;background:var(--paper);color:var(--ink);-webkit-text-size-adjust:100%}
body{margin:0;font:400 1rem/1.6 var(--sans)}
main{width:min(100% - 3rem, 34ch);margin:0 auto;padding:4rem 0 3rem}
@media (min-width:40rem){ main{width:min(100% - 3rem, 60ch);padding-top:5rem} }
a{color:var(--accent);text-decoration:underline;text-underline-offset:.18em;text-decoration-thickness:1px}
a:hover{color:var(--muted)}
a:focus-visible{outline:1px solid var(--accent);outline-offset:3px}
.wordmark{font:400 .8125rem/1.4 var(--mono);letter-spacing:.04em;color:var(--muted);margin:0}
.tagline{font-style:italic;font-weight:300;color:var(--muted);margin:.25rem 0 3rem}
h1{font-size:1.5rem;font-weight:600;line-height:1.25;margin:0}
.role{color:var(--muted);margin:.2rem 0 0}
h2{font:400 .8125rem/1.4 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);
   margin:3.75rem 0 1.25rem;padding-top:1.5rem;border-top:1px solid var(--rule)}
p{margin:0 0 1rem}
main ul:not(.find){list-style:none;margin:0 0 1rem;padding:0}
main ul:not(.find) li{position:relative;padding-left:1.1rem;margin:0 0 1rem}
main ul:not(.find) li:last-child{margin-bottom:0}
main ul:not(.find) li::before{content:"";position:absolute;left:0;top:.65em;width:5px;height:5px;background:var(--muted)}
ul.find{list-style:none;margin:0;padding:0}
ul.find a{display:grid;grid-template-columns:5.5rem 1fr auto;column-gap:.75rem;align-items:baseline;
  padding:.45rem 0;color:var(--ink);text-decoration:none}
ul.find .t{color:var(--ink)}
ul.find .d{color:var(--muted);font-weight:300;font-size:.875rem}
ul.find .a{color:var(--muted);justify-self:end}
ul.find a:hover .t,ul.find a:hover .d,ul.find a:hover .a{color:var(--muted)}
ul.find a:hover .d{opacity:.8}
footer{margin-top:4rem;padding-top:1.5rem;border-top:1px solid var(--rule);
  font-size:.8125rem;color:var(--muted);display:flex;justify-content:space-between;gap:.5rem 1rem;flex-wrap:wrap}
</style>
</head>
<body>
<main>
  <p class="wordmark">{{site}}</p>
  <p class="tagline">{{tagline}}</p>

  <h1>{{name}}</h1>
  <p class="role">{{role}}</p>

{{content}}

  <footer>
    <span>{{copyright}}</span>
    <span>{{site}}</span>
  </footer>
</main>
</body>
</html>
